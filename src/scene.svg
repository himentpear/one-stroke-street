      <path d="M0 3L5 0H68V37L64 41H0Z" fill="var(--window-face)" stroke="var(--target)" stroke-width="1.5"/>
      <path d="M0 36H68L64 41H0Z" fill="var(--target)"/>
      <g fill="var(--target)">
        <rect x="8" y="7" width="13" height="23" rx="1.5"/>
        <rect x="27.5" y="7" width="13" height="23" rx="1.5"/>
        <rect x="47" y="7" width="13" height="23" rx="1.5"/>
      </g>
      <path d="M8 17H21 M27.5 17H40.5 M47 17H60" fill="none" stroke="var(--window-face)" stroke-width="2"/>
    </g>
