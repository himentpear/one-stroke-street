<svg data-board viewBox="0 0 600 328" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="oss-title oss-desc">
  <title id="oss-title">一笔拆掉街两边的四间亮窗房</title>
  <desc id="oss-desc">左楼屋顶的保龄球招牌搁在双扣雨棚上。棚的右下方有两间亮窗房，下面是指向右方的弹板。街对面还有两间亮窗房。可以在图上拖线，或用下方按钮试划卡扣。</desc>
