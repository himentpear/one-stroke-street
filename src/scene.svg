      <path d="M-32 1V-5H-16V-11H16V-5H32V1Z" fill="var(--wash)" stroke="var(--dark-edge)" stroke-width="1.4"/>
      <path d="M-11-5H11 M-29 5H29" fill="none" stroke="var(--edge)" stroke-width="1.4"/>
    </g>
    <g id="oss-pin">
      <circle r="10" fill="var(--pin-face)" stroke="var(--pin-ink)" stroke-width="2.5"/>
      <circle r="4" fill="var(--pin-ink)"/>
    </g>
  </defs>
  <g data-world>
