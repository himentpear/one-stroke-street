<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f2e8">
  <meta name="description" content="在纸板商业街上划出一笔，用真实刚体物理让保龄球招牌砸穿街两边的四间店铺。">
  <link rel="icon" href="data:,">
  <title>一笔打烊 · 保龄球馆的最后一单</title>
  <style>
:root {
  color-scheme: light;
  --paper: #f7f2e8; --ink: #252724; --target: #2168a3; --pin-ink: #bc491b;
  --wash: #efeade; --fine: #d8d3c7; --edge: #a6a296; --dark-edge: #575851;
  --window-face: #d9e5e6; --pin-face: #f8d3b4;
  font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink); background: var(--paper);
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; background: repeating-linear-gradient(0deg, transparent 0 5px, #25272403 5px 6px); }
button, summary { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button { border: 1px solid var(--ink); border-radius: 5px; color: var(--ink); background: var(--paper); }
button:disabled { cursor: default; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--target); outline-offset: 3px; }
.game { width: min(100%, 1080px); margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) max(clamp(12px, 4vw, 48px), env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(clamp(12px, 4vw, 48px), env(safe-area-inset-left)); }
.masthead { display: flex; justify-content: space-between; align-items: center; padding: 0 0 clamp(10px, 2vh, 18px); border-bottom: 3px solid var(--ink); }
.header-actions { display: flex; align-items: center; gap: 8px; }
h1, h2, p, dl, dd { margin: 0; }
h1 { display: flex; align-items: center; gap: .45em; font-size: clamp(1.6rem, 3.8vw, 2.75rem); letter-spacing: -.065em; font-weight: 900; line-height: 1.15; }
.cut-mark { display: inline-block; width: .9em; height: .86em; position: relative; transform: rotate(-9deg); background: var(--pin-ink); clip-path: polygon(0 12%, 100% 0, 92% 38%, 20% 77%, 88% 49%, 83% 86%, 1% 100%); }
.sound { display: inline-flex; align-items: center; gap: .4em; padding: .45em .8em; min-height: 44px; font-size: .93rem; }
.sound[aria-pressed="true"] { color: var(--paper); background: var(--ink); }
.sound-bars { display: inline-flex; align-items: center; gap: 2px; height: 14px; }
.sound-bars i { width: 2px; height: 6px; background: currentColor; }
.sound-bars i:nth-child(2) { height: 14px; }
.sound-bars i:nth-child(3) { height: 10px; }
.level-head { display: flex; align-items: center; gap: 18px; justify-content: space-between; padding: clamp(12px, 2.2vh, 22px) 0; }
h2 { font-size: clamp(1.3rem, 3vw, 2.2rem); line-height: 1.2; letter-spacing: -.04em; font-weight: 850; }
.level-head p { margin-top: .35em; color: var(--dark-edge); font-size: .98rem; }
.scoreboard { display: flex; gap: clamp(15px, 3.4vw, 45px); flex-shrink: 0; }
.scoreboard div { border-left: 2px solid var(--edge); padding-left: clamp(8px, 1.3vw, 16px); }
.scoreboard dt { font-size: .88rem; color: var(--dark-edge); }
.scoreboard dd { font-variant-numeric: tabular-nums; line-height: 1.1; }
.scoreboard b { font-size: clamp(1.55rem, 3.2vw, 2.45rem); }
.scoreboard small { font-size: 1rem; color: var(--dark-edge); }
.street-field { width: 100%; height: min(56svh, 54vw, 550px); min-height: 180px; border: 1.5px solid var(--ink); border-radius: 3px 3px 0 0; background-color: var(--paper); overflow: hidden; }
[data-board] { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
[data-phase="moving"] [data-board], [data-phase="done"] [data-board] { cursor: default; }
.score-pop { display: inline-block; animation: score-pop .26s cubic-bezier(.22, 1.35, .36, 1); }
.action-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1.5px solid var(--ink); border-top: 0; border-radius: 0 0 3px 3px; padding: 10px clamp(10px, 2vw, 20px); background: #fff9ed; transition: background-color .25s ease; }
[data-phase="done"][data-cleared-all="true"] .action-row { background: #eaf2f7; }
@keyframes score-pop {
  0% { transform: scale(1); }
  45% { transform: scale(1.26); color: var(--target); }
  100% { transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .score-pop { animation: none; }
  .action-row { transition: none; }
}
[data-outcome] { font-size: 1rem; line-height: 1.5; font-weight: 550; }
.reset { flex: none; min-width: 84px; min-height: 44px; padding: .45em 1em; font-weight: 750; color: var(--paper); background: var(--pin-ink); border-color: var(--pin-ink); }
.reset:disabled { background: var(--wash); color: var(--dark-edge); border-color: var(--edge); }
footer { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: .5rem 1rem; margin-top: 8px; }
.footer-tools { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; }
.legend { display: flex; gap: 1.15rem; color: var(--dark-edge); }
.legend span, summary, .choices button, .debug-toggle { font-size: .88rem; }
.legend span { display: inline-flex; align-items: center; gap: .42rem; }
.rivet { width: 13px; height: 13px; border: 2px solid var(--pin-ink); border-radius: 50%; background: radial-gradient(var(--pin-ink) 30%, var(--pin-face) 35%); }
.windows { width: 17px; height: 12px; background: repeating-linear-gradient(90deg, var(--target) 0 4px, transparent 4px 6px); }
.debug-toggle { min-height: 36px; padding: .25em .65em; color: var(--dark-edge); border-color: var(--edge); }
.debug-toggle[aria-pressed="true"] { color: var(--paper); background: var(--target); border-color: var(--target); }
summary { min-height: 44px; padding: 11px 0; color: var(--dark-edge); }
.choices { display: flex; gap: .4rem; flex-wrap: wrap; }
.choices button { min-height: 44px; padding: .4em .75em; }
.choices button:disabled { color: var(--dark-edge); border-color: var(--edge); }
@media (max-width: 620px) {
  .level-head { flex-wrap: wrap; align-items: flex-start; gap: 12px; }
  .scoreboard { gap: 1.25rem; }
  .scoreboard div { display: flex; align-items: baseline; gap: .45rem; }
  .scoreboard b { font-size: 1.4rem; }
  .street-field { height: min(63vw, 335px); }
  .reset { min-width: 64px; }
}
@media (max-height: 500px) and (min-width: 621px) {
  .game { padding-top: 6px; }
  .masthead, .level-head { padding-block: 5px; }
  h1, h2 { font-size: 1.35rem; }
  .street-field { height: 55svh; min-height: 110px; }
}
</style>
</head>
<body>
  <main class="game" data-phase="ready">
    <header class="masthead">
      <h1><span class="cut-mark" aria-hidden="true"></span>一笔打烊</h1>
      <div class="header-actions">
        <button class="sound" type="button" data-sound aria-pressed="false">
          <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span>
          音效<span data-sound-state>关</span>
        </button>
      </div>
    </header>
    <section class="play" aria-labelledby="level-title">
      <header class="level-head">
        <div><h2 id="level-title">保龄球馆的最后一单</h2><p>用一笔拆完街两边的四间亮房。</p></div>
        <dl class="scoreboard">
          <div><dt>剩余笔数</dt><dd><b data-strokes>1</b><small> 笔</small></dd></div>
          <div><dt>已拆房间</dt><dd><b data-cleared>0</b><small> / 4</small></dd></div>
        </dl>
      </header>
      <div class="street-field">
        <canvas data-board width="600" height="328" role="img" aria-label="保龄球馆的最后一单：在纸板商业街上拖出一条直线，切断卡扣或楼块，拆除四间亮窗房。"></canvas>
      </div>
      <div class="action-row">
        <p data-outcome role="status" aria-live="polite">划过圆扣或亮窗，松手拆除。</p>
        <button type="button" class="reset" data-reset disabled>重画</button>
      </div>
    </section>
    <footer>
      <div class="legend" aria-label="图例"><span><i class="rivet"></i>可拆卡扣</span><span><i class="windows"></i>亮窗房间</span></div>
      <div class="footer-tools">
        <button type="button" class="debug-toggle" data-debug aria-pressed="false">物理调试</button>
        <details><summary>按键划线</summary><div class="choices">
          <button type="button" data-trial="left">划左扣</button><button type="button" data-trial="right">划右扣</button><button type="button" data-trial="both">同时划两扣</button>
        </div></details>
      </div>
    </footer>
    <noscript>请在浏览器中开启 JavaScript 以运行物理模拟并绘制拆迁线。</noscript>
